<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>hey-i18n demo</title>
    </head>
    <body>
        <main>
            <h1>hey-i18n demo</h1>
            <p>当前语言：<span id="current-locale"></span></p>
            <section>
                <p id="greeting"></p>
                <p id="message"></p>
                <p id="fallback"></p>
            </section>
            <section>
                <button type="button" data-locale="en-US">English</button>
                <button type="button" data-locale="zh-CN">简体中文</button>
                <button type="button" data-locale="ar-SA">العربية</button>
                <button type="button" data-locale="de-DE">Deutsch（空语言包）</button>
            </section>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
