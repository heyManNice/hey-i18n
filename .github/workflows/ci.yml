name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    quality:
        name: Lint / Format / Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      studio/package-lock.json
                      demo/package-lock.json
            - run: npm ci
            - run: npm --prefix studio ci
            - run: npm --prefix demo ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run build
            - run: npm run build:studio

    e2e:
        name: Playwright E2E
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      studio/package-lock.json
                      demo/package-lock.json
            - run: npm ci
            - run: npm --prefix studio ci
            - run: npm --prefix demo ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
